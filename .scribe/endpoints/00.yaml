    uri: api/register
    metadata:
      custom: []
      groupName: Authentication
      groupDescription: 'Register, log in, and manage OTP-based verification and password resets for mobile-app users.'
      subgroup: ''
      subgroupDescription: ''
      title: Register
      description: |-
        Create a new mobile-app account. Only available when AUTH_MODE=password (route disappears entirely
        under AUTH_MODE=otp — login covers registration there instead).

        **Registering logs the customer in.** The response carries a Bearer token in exactly the same
        shape `POST /api/login` returns it (top-level `token` and `data.token`), and the account comes
        back already verified. Do not send the customer to an OTP screen and do not call `login`
        afterwards — store the token and continue into the app.

        Projects that genuinely need a confirmed email or phone before first use can set
        `REGISTER_REQUIRES_VERIFICATION=true`, which restores the older behaviour: an OTP is sent,
        no token is issued, and the client must call `POST /api/login`. Check `data.is_verified` /
        the presence of `token` rather than assuming either shape.

        `IS_TESTING=true` forces that same two-step shape on (so a testing install rehearses the
        verification screen), and returns the code as `data.otp` — always `123456`.
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
      Accept-Language: en
      X-API-TOKEN: '{YOUR_APP_X_API_TOKEN}'
      X-Device-Id: 11111111-1111-4111-8111-111111111111
      X-Platform: web
