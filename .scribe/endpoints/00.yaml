  -
    custom: []
    httpMethods:
      - POST
    uri: api/login
    metadata:
      custom: []
      groupName: Authentication
      groupDescription: ''
      subgroup: ''
      subgroupDescription: ''
      title: Login
      description: |-
        Behavior branches on AUTH_MODE (see GET /api/config → auth_mode):
        - `password` (default): body is `identifier` + `password` (+ optional `remember_me`). Issues a Sanctum
          token immediately. An unverified account still gets a token (usable with verify-otp) plus a fresh
          verify OTP.
        - `otp`: body is `identifier` only (+ optional `name` for first-time users). Auto-creates the user if
          missing (promoting any existing guest tied to the same X-Device-Id), sends a `login` OTP, and does
          NOT issue a token — client follows with POST /api/verify-login.

        Under AUTH_MODE=otp, only `identifier` (+ optional `name` string for first-time users) apply —
        `password`/`remember_me` are ignored.
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
      Accept-Language: en
      X-API-TOKEN: '{YOUR_APP_X_API_TOKEN}'
      X-Device-Id: 11111111-1111-4111-8111-111111111111
      X-Platform: web
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      identifier:
        custom: []
        name: identifier
        description: 'Email, phone, or username. A phone MUST carry its country code (`966500000000` or `+966500000000`); it is stored in E.164.'
        required: true
        example: jane@example.com
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      type:
        custom: []
        name: type
        description: 'Which identifier is being sent — `email`, `phone`, or `username` (never inferred from the value).'
        required: true
        example: email
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      password:
        custom: []
        name: password
        description: ''
        required: true
        example: SecurePass123!
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      remember_me:
        custom: []
        name: remember_me
        description: "Extends the issued token's lifetime to 30 days."
        required: false
        example: false
        type: boolean
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      identifier: jane@example.com
      type: email
      password: SecurePass123!
      remember_me: false
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"success": true, "message": "Login successful.", "token": "1|abcdef123456", "data": {"user": {"id": 42, "name": "Jane Doe", "email": "jane@example.com", "verified_at": "2026-07-18T09:00:00.000000Z"}, "is_verified": true, "account_restored": false, "token_id": 7, "token": "1|abcdef123456"}, "errors": null}'
        headers: []
        description: 'password mode — verified'
      -
        custom: []
        status: 200
        content: '{"success": true, "message": "Account not verified. Please check your email.", "token": "1|abcdef123456", "data": {"user": {"id": 42, "name": "Jane Doe", "verified_at": null}, "is_verified": false, "token_id": 7, "otp_expires_in_minutes": 5, "token": "1|abcdef123456"}, "errors": null}'
        headers: []
        description: 'password mode — unverified (fresh OTP sent)'
      -
        custom: []
        status: 200
        content: '{"success": true, "message": "Login code sent. Enter the code to complete sign in.", "data": {"identifier": "jane@example.com", "channel": "email", "otp_expires_in_minutes": 5}, "errors": null}'
        headers: []
